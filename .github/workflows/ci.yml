name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate mock data (deterministic seed)
        run: python scripts/generate.py --reset --days 7

      - name: Land raw CSVs into DuckDB
        run: python scripts/load_raw.py

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build
