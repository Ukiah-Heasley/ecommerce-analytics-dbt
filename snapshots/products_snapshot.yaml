snapshots:
  - name: products_snapshot
    relation: ref('stg_products')
    description: >
      SCD2 history of `stg_products`. Same strategy as `users_snapshot` —
      `timestamp` on source `updated_at`. Snapshots a near-source view so
      there are no derived-column drift concerns.
    config:
      strategy: timestamp
      unique_key: product_id
      updated_at: updated_at
      hard_deletes: new_record
    columns:
      - name: dbt_scd_id
        description: SCD2 surrogate key. Unique per (product_id, dbt_valid_from).
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: dbt_valid_from
        data_tests:
          - not_null
