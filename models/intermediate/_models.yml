version: 2

models:
  - name: int_users
    description: >
      Users with cross-source identity resolution attached, derived from the
      full `users_snapshot` SCD2 history. Each row is one SCD2 version of one
      `user_id` with the canonical assignment for that version's
      `email_normalized`. Canonical is recomputed every build — no derived
      state is persisted in the snapshot.
    columns:
      - name: user_sk
        description: >
          Surrogate key = `dbt_scd_id` from the snapshot. Stable per
          (user_id, valid_from). Used as the join key from `fct_*` tables.
        data_tests:
          - unique
          - not_null

      - name: user_id
        description: Natural key from the source system.
        data_tests:
          - not_null

      - name: canonical_user_id
        description: >
          Cross-source identity. For a given `email_normalized`, the
          `auth_db` user_id wins; ties break on `user_id` ascending. Equals
          `user_id` when the email is unique or null. Recomputed per build.
        data_tests:
          - not_null

      - name: is_merged
        description: True when `canonical_user_id != user_id`.

      - name: email_raw
        meta:
          contains_pii: true

      - name: email_normalized
        meta:
          contains_pii: true

      - name: phone
        meta:
          contains_pii: true

      - name: valid_from
        description: SCD2 effective-from (= snapshot `dbt_valid_from`).
        data_tests:
          - not_null

      - name: valid_to
        description: SCD2 effective-to (= snapshot `dbt_valid_to`). NULL for current.

      - name: is_current
        description: Convenience flag — true when `valid_to is null`.

  - name: int_sessions_deduped
    description: >
      `stg_sessions` collapsed to one row per `session_id`, keeping the
      latest-arriving copy (`row_number() over (partition by session_id order
      by _ingested_at desc) = 1`). This is where the append-only stream
      becomes a deduplicated entity stream.
    columns:
      - name: session_id
        description: >
          Now unique — this is the dedup contract. The `unique` test below
          is the live verification that dedup is working.
        data_tests:
          - unique
          - not_null

      - name: started_at
        data_tests:
          - not_null

      - name: _ingested_at
        description: Latest arrival timestamp among the duplicate set.
        data_tests:
          - not_null
